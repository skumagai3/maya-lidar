[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayalidar"
version = "0.1.0"
description = "Semantic segmentation of Maya archaeological features in airborne lidar"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sam Kumagai"}]
# TensorFlow is left out on purpose: Colab ships its own build, and locally the
# right package depends on the hardware (see environment.yml).
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "scipy",
    "tifffile",
]

[tool.setuptools.packages.find]
where = ["src"]
