# U-Net decoder on an ImageNet-pretrained ResNet50 encoder: train with the encoder
# frozen, then unfreeze the deeper blocks and fine-tune at a lower learning rate.
experiment: resnet50_unet

data:
  split: official
  val_frac: 0.15
  split_seed: 42

model:
  name: resnet50_unet
  encoder_weights: imagenet

loss:
  bce_weight: 1.0
  dice_class_weights: uniform
  dice_skip_absent_classes: false  # true: no Dice term for a class absent from the batch

train:
  batch_size: 4
  epochs: 60
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  lr_patience: 5
  early_stop_patience: 12
  seed: 0
  cache_train: true     # hold training tiles in RAM as uint8 (about 2 GB)
  cache_val: true
  mixed_precision: false # float16 compute with float32 weights; faster on recent GPUs

finetune:
  epochs: 30
  lr_factor: 0.1                     # fine-tune learning rate = learning_rate * lr_factor
  unfreeze_from: conv4_block1_1_conv # first layer of ResNet50 stage 4

smoke:
  n_train: 64
  n_val: 16
  epochs: 2

eval:
  thresholds: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8]
